name: Ci/cd pipeline to push docker image to dockerhub

on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: check code
        uses: actions/checkout@v4

      - name: login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/app-image:v1 .

      - name: push to dockerhub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/app-image:v1

